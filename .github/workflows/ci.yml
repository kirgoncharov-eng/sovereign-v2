name: CI

# Каждый PR и каждый пуш в main: линтер, типы, тесты и сборка.
# Красная проверка — сигнал не мёржить.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Партия в браузере на экране телефона: падает, если игра застряла, в консоли ошибки
  # или первая сессия перегружена. Скриншоты ходов 1–3 — в артефактах запуска.
  # Идёт параллельно с check; 24 хода — первый срок и начало второго.
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run playtest:install -- --with-deps
      - run: npm run playtest -- --turns=24 --out=playtest
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest
          path: web/playtest
          retention-days: 14
