  <rect x="124" y="120" width="490" height="22" fill="#25201b" stroke="#98c379" stroke-width="1.4"/>
  <text x="369" y="135" text-anchor="middle" fill="#98c379" font-family="'Courier New', monospace" font-weight="700" font-size="11.2">
