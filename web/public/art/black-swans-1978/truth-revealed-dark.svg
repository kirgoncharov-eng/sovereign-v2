<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 156" width="100%" height="100%">
  <rect x="0" y="0" width="640" height="156" fill="#25201b" stroke="#ebe2cd" stroke-width="3"/>
  <rect x="8" y="8" width="624" height="140" fill="#2f2922" stroke="#ebe2cd" stroke-width="1.2"/>

  <!-- Left Broken Seal & Open Dossier Icon -->
