    <line x1="0" y1="-28" x2="0" y2="32" stroke="#ebe2cd" stroke-width="1.5"/>
    <!-- Broken Red Wax Seal split in two halves -->
    <path d="M-3,-6 A 14,14 0 1 0 -3,18 L-1,10 L-5,4 Z" fill="#e56a54" stroke="#ebe2cd" stroke-width="1.2"/>
    <path d="M 3,-6 A 14,14 0 1 1 3,18 L 1,10 L 5,4 Z" fill="#e56a54" stroke="#ebe2cd" stroke-width="1.2"/>
    <text x="0" y="42" text-anchor="middle" fill="#ebe2cd" font-family="'PT Sans Narrow', sans-serif" font-weight="700" font-size="10.5" letter-spacing="1">ВСКРЫТО</text>
  </g>

