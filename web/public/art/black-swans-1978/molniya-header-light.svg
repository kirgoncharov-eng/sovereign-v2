  <g><polygon points="-20,0 -6,0 -18,14 -32,14" fill="#a3291e"/><polygon points="8,0 22,0 10,14 -4,14" fill="#a3291e"/><polygon points="36,0 50,0 38,14 24,14" fill="#a3291e"/><polygon points="64,0 78,0 66,14 52,14" fill="#a3291e"/><polygon points="92,0 106,0 94,14 80,14" fill="#a3291e"/><polygon points="120,0 134,0 122,14 108,14" fill="#a3291e"/><polygon points="148,0 162,0 150,14 136,14" fill="#a3291e"/><polygon points="176,0 190,0 178,14 164,14" fill="#a3291e"/><polygon points="204,0 218,0 206,14 192,14" fill="#a3291e"/><polygon points="232,0 246,0 234,14 220,14" fill="#a3291e"/><polygon points="260,0 274,0 262,14 248,14" fill="#a3291e"/><polygon points="288,0 302,0 290,14 276,14" fill="#a3291e"/><polygon points="316,0 330,0 318,14 304,14" fill="#a3291e"/><polygon points="344,0 358,0 346,14 332,14" fill="#a3291e"/><polygon points="372,0 386,0 374,14 360,14" fill="#a3291e"/><polygon points="400,0 414,0 402,14 388,14" fill="#a3291e"/><polygon points="428,0 442,0 430,14 416,14" fill="#a3291e"/><polygon points="456,0 470,0 458,14 444,14" fill="#a3291e"/><polygon points="484,0 498,0 486,14 472,14" fill="#a3291e"/><polygon points="512,0 526,0 514,14 500,14" fill="#a3291e"/><polygon points="540,0 554,0 542,14 528,14" fill="#a3291e"/><polygon points="568,0 582,0 570,14 556,14" fill="#a3291e"/><polygon points="596,0 610,0 598,14 584,14" fill="#a3291e"/><polygon points="624,0 638,0 626,14 612,14" fill="#a3291e"/><polygon points="652,0 666,0 654,14 640,14" fill="#a3291e"/></g>
  <line x1="0" y1="16" x2="640" y2="16" stroke="#1f1a15" stroke-width="2"/>

