  <!-- Top Telegraph Form Metadata -->
  <text x="40" y="35" fill="#5a4f3e" font-family="'Courier New', monospace" font-weight="700" font-size="12.5" letter-spacing="0.8">
    БЛАНК № 01-ЧП · ЛИНИЯ ПРАВИТЕЛЬСТВЕННОЙ СВЯЗИ НР
  </text>
  <text x="600" y="35" text-anchor="end" fill="#a3291e" font-family="'Courier New', monospace" font-weight="700" font-size="12.5" letter-spacing="1">
    ВНЕ ОЧЕРЕДИ
  </text>
  <line x1="28" y1="42" x2="612" y2="42" stroke="#1f1a15" stroke-width="1.2" stroke-dasharray="6 3"/>

  <!-- Glued Paper Telegraph Tape Strip 1: "МОЛНИЯ" with Lightning Bolt -->
  <g transform="translate(38, 52) rotate(-0.6)">
    <rect x="0" y="0" width="394" height="54" fill="#9c261b" stroke="#1f1a15" stroke-width="2"/>
    <!-- Lightning bolt icon -->
    <polygon points="26,7 12,29 24,29 16,47 40,23 27,23 36,7" fill="#f7efe0"/>
    <text x="198" y="38" text-anchor="middle" fill="#f7efe0" font-family="Impact, 'PT Sans Narrow', 'Arial Narrow', sans-serif" font-weight="900" font-size="35" letter-spacing="2.8">
      МОЛНИЯ · СРОЧНО
    </text>
  </g>

  <!-- Right Stamp: "ЛИЧНО ПРЕЗИДЕНТУ / ДОЛОЖИТЬ НЕМЕДЛЕННО" -->
  <g transform="translate(522, 79) rotate(2.5)">
    <rect x="-78" y="-25" width="156" height="50" fill="#eee6ce" stroke="#a3291e" stroke-width="2.6"/>
    <rect x="-74" y="-21" width="148" height="42" fill="none" stroke="#a3291e" stroke-width="1"/>
    <text x="0" y="-4" text-anchor="middle" fill="#a3291e" font-family="'Courier New', monospace" font-weight="700" font-size="11.5" letter-spacing="0.8">
      ЛИЧНО ПРЕЗИДЕНТУ
    </text>
    <text x="0" y="12" text-anchor="middle" fill="#1f1a15" font-family="'Courier New', monospace" font-weight="700" font-size="11" letter-spacing="0.6">
      БУДИТЬ НЕМЕДЛЕННО
    </text>
  </g>

  <!-- Glued Paper Telegraph Tape Strip 2: Time & Fog Warning -->
  <g transform="translate(38, 115)">
    <rect x="0" y="0" width="564" height="30" fill="#eee6ce" stroke="#1f1a15" stroke-width="1.5"/>
    <text x="282" y="20" text-anchor="middle" fill="#1f1a15" font-family="'Courier New', monospace" font-weight="700" font-size="11.8" letter-spacing="0.2">
      ПРИНЯТО 03:42 · СВЕДЕНИЯ С МЕСТА ПРОТИВОРЕЧАТ ДРУГ ДРУГУ · ТРЕБУЕТСЯ РЕШЕНИЕ
    </text>
  </g>
