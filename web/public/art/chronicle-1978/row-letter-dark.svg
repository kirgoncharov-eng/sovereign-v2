      <text x="38" y="84" text-anchor="middle" fill="#df6e5d" font-family="'Courier New', monospace" font-weight="700" font-size="10">ШТЕМПЕЛЬ</text>
      <text x="38" y="96" text-anchor="middle" fill="#df6e5d" font-family="'Courier New', monospace" font-weight="700" font-size="10">1978 · НР</text>

      <!-- Sender & Handwritten Letter Body -->
      <text x="80" y="29" fill="#df6e5d" font-family="'PT Sans Narrow', 'Arial Narrow', sans-serif" font-weight="700" font-size="12" letter-spacing="1.1">
        ПИСЬМО В ПРИЁМНУЮ · ВОЗВРАЩЕНИЕ ЧЕЛОВЕКА (ХОД 4 → ЧЕРЕЗ ГОД)
      </text>
      <foreignObject x="80" y="33" width="540" height="82">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'PT Serif', Georgia, serif; font-style:italic; font-size:15px; line-height:1.36; color:#d8e3f5;">
          «Товарищ президент, год назад моё письмо с комвольного комбината прочитали в вечернем эфире. Цех тогда починили — а теперь меня саму выдвинули в горсовет».
          <span style="display:block; text-align:right; font-style:normal; font-family:'PT Sans Narrow', sans-serif; font-weight:700; font-size:12.5px; color:#df6e5d; margin-top:2px;">
            — Елена Корзун, прядильщица, Минск
          </span>
        </div>
      </foreignObject>
    </svg>