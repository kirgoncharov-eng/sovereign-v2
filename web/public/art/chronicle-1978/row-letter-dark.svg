<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 328 164" width="100%" height="100%">
      <rect width="328" height="164" fill="#1c1915"/>
      <rect x="4" y="5" width="320" height="154" fill="#27221c" stroke="#6b5f4a" stroke-width="1.5"/>
      <!-- Horizontal notebook ruling lines -->
      <line x1="5" y1="42" x2="323" y2="42" stroke="rgba(130, 170, 220, 0.15)" stroke-width="1"/>
      <line x1="5" y1="64" x2="323" y2="64" stroke="rgba(130, 170, 220, 0.15)" stroke-width="1"/>
      <line x1="5" y1="86" x2="323" y2="86" stroke="rgba(130, 170, 220, 0.15)" stroke-width="1"/>
      <line x1="5" y1="108" x2="323" y2="108" stroke="rgba(130, 170, 220, 0.15)" stroke-width="1"/>
      <line x1="5" y1="130" x2="323" y2="130" stroke="rgba(130, 170, 220, 0.15)" stroke-width="1"/>
      <!-- Vertical red margin rule -->
      <line x1="56" y1="11" x2="56" y2="158" stroke="#d16654" stroke-width="1.4"/>

      <!-- Postal envelope border ticks across top edge -->
      <g><polygon points="10,5 19,5 15,10 6,10" fill="#df6e5d"/><polygon points="24,5 33,5 29,10 20,10" fill="#7ca6de"/><polygon points="38,5 47,5 43,10 34,10" fill="#df6e5d"/><polygon points="52,5 61,5 57,10 48,10" fill="#7ca6de"/><polygon points="66,5 75,5 71,10 62,10" fill="#df6e5d"/><polygon points="80,5 89,5 85,10 76,10" fill="#7ca6de"/><polygon points="94,5 103,5 99,10 90,10" fill="#df6e5d"/><polygon points="108,5 117,5 113,10 104,10" fill="#7ca6de"/><polygon points="122,5 131,5 127,10 118,10" fill="#df6e5d"/><polygon points="136,5 145,5 141,10 132,10" fill="#7ca6de"/><polygon points="150,5 159,5 155,10 146,10" fill="#df6e5d"/><polygon points="164,5 173,5 169,10 160,10" fill="#7ca6de"/><polygon points="178,5 187,5 183,10 174,10" fill="#df6e5d"/><polygon points="192,5 201,5 197,10 188,10" fill="#7ca6de"/><polygon points="206,5 215,5 211,10 202,10" fill="#df6e5d"/><polygon points="220,5 229,5 225,10 216,10" fill="#7ca6de"/><polygon points="234,5 243,5 239,10 230,10" fill="#df6e5d"/><polygon points="248,5 257,5 253,10 244,10" fill="#7ca6de"/><polygon points="262,5 271,5 267,10 258,10" fill="#df6e5d"/><polygon points="276,5 285,5 281,10 272,10" fill="#7ca6de"/><polygon points="290,5 299,5 295,10 286,10" fill="#df6e5d"/><polygon points="304,5 313,5 309,10 300,10" fill="#7ca6de"/></g>
      <line x1="4" y1="10.5" x2="324" y2="10.5" stroke="#6b5f4a" stroke-width="1"/>

      <!-- Left Circular Postmark & Envelope Icon -->
      <g transform="translate(10, 22) scale(0.95)">
        
      <circle cx="18" cy="20" r="15" fill="none" stroke="#e28876" stroke-width="1.8"/>
      <circle cx="18" cy="20" r="11.5" fill="none" stroke="#e28876" stroke-width="1" stroke-dasharray="4 2"/>
      <path d="M 10,15 L 26,15 L 26,25 L 10,25 Z" fill="none" stroke="#e28876" stroke-width="1.4"/>
      <path d="M 10,15 L 18,21 L 26,15" fill="none" stroke="#e28876" stroke-width="1.4"/>
      <path d="M 28,13 Q 33,11 38,13 M 28,20 Q 33,18 38,20 M 28,27 Q 33,25 38,27" fill="none" stroke="#e28876" stroke-width="1.4"/>
      </g>
      <text x="29" y="78" text-anchor="middle" fill="#df6e5d" font-family="'Courier New', monospace" font-weight="700" font-size="10">ШТЕМПЕЛЬ</text>
      <text x="29" y="91" text-anchor="middle" fill="#df6e5d" font-family="'Courier New', monospace" font-weight="700" font-size="10">1978 · НР</text>

      <!-- Sender & Handwritten Letter Body (14.8px body, 12.5px signature) -->
      <text x="64" y="26" fill="#df6e5d" font-family="'PT Sans Narrow', 'Arial Narrow', sans-serif" font-weight="700" font-size="11.5" letter-spacing="0.6">
        ПИСЬМО В ПРИЁМНУЮ · ЧЕРЕЗ ГОД
      </text>
      <foreignObject x="64" y="31" width="252" height="124">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'PT Serif', Georgia, serif; font-style:italic; font-size:14.6px; line-height:1.36; color:#d8e3f5;">
          «Товарищ президент, год назад моё письмо с комбината прочитали в эфире. Цех починили — а меня саму выдвинули в горсовет».
          <span style="display:block; text-align:right; font-style:normal; font-family:'PT Sans Narrow', sans-serif; font-weight:700; font-size:12.5px; color:#df6e5d; margin-top:4px;">
            — Елена Корзун, прядильщица, Минск
          </span>
        </div>
      </foreignObject>
    </svg>