<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 106" width="100%" height="100%">
      <rect width="640" height="106" fill="#1c1915"/>
      <!-- Quiet inset strip with double left nocturnal bar -->
      <rect x="12" y="8" width="616" height="90" fill="#18201d" stroke="#6ec9a1" stroke-width="1" stroke-dasharray="2 3"/>
      <rect x="12" y="8" width="6" height="90" fill="#6ec9a1"/>
      <line x1="22" y1="8" x2="22" y2="98" stroke="#6ec9a1" stroke-width="1.2"/>

      <!-- Left Tuning-Eye / Radio Dial Icon -->
      <g transform="translate(32, 20)">
        
      <circle cx="20" cy="20" r="16" fill="#111d18" stroke="#8fd4b5" stroke-width="2"/>
      <path d="M 8,14 A 13,13 0 1,0 32,14 L 24,18 A 5,5 0 1,1 16,18 Z" fill="#5ce09b" opacity="0.88"/>
      <circle cx="20" cy="20" r="4.5" fill="#8fd4b5"/>
      <circle cx="20" cy="20" r="1.8" fill="#e9f7ef"/>
      </g>
      <!-- Sine-wave whisper line under icon -->
      <path d="M 32,74 Q 39,69 46,74 T 60,74 T 72,74" fill="none" stroke="#6ec9a1" stroke-width="1.5"/>

      <text x="84" y="27" fill="#8fb0a0" font-family="'Courier New', monospace" font-weight="700" font-size="11.5" letter-spacing="1.5">
        СТРАННОСТЬ В ХРОНИКЕ · ЗАМЕТКА НА ПОЛЯХ
      </text>
      <foreignObject x="84" y="32" width="530" height="64">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'PT Serif', Georgia, serif; font-style:italic; font-size:15px; line-height:1.36; color:#d7e6df;">
          — После полуночи на частоте республиканского радио женский голос четверть часа ровно читал двузначные числа; утренний дежурный в Доме радио клянётся, что передатчик был выключен.
        </div>
      </foreignObject>
    </svg>