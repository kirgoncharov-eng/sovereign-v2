<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 112" width="100%" height="100%">
      <rect width="640" height="112" fill="#dfd5b6"/>
      <!-- Chamfered cardboard shop price-tag silhouette -->
      <polygon points="28,8 630,8 630,104 28,104 8,56" fill="#d4c39b" stroke="#3e3527" stroke-width="2"/>
      <polygon points="32,13 625,13 625,99 32,99 14,56" fill="none" stroke="#3e3527" stroke-width="1" stroke-dasharray="5 3"/>

      <!-- Punched tag eyelet & twine string on left (instant recognition without text) -->
      <circle cx="29" cy="56" r="8.5" fill="#dfd5b6" stroke="#3e3527" stroke-width="2.5"/>
      <circle cx="29" cy="56" r="11.5" fill="none" stroke="#3e3527" stroke-width="1"/>
      <path d="M 2,38 Q 14,48 25,54 M 2,72 Q 14,62 25,58" fill="none" stroke="#6e5a3a" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Shop Stamp Header on Left Block -->
      <text x="52" y="36" fill="#1f3a60" font-family="'PT Sans Narrow', 'Arial Narrow', sans-serif" font-weight="700" font-size="13" letter-spacing="1.2">
        ТОРГ · ПРЕЙСКУРАНТ
      </text>
      <text x="52" y="57" fill="#251f17" font-family="'PT Sans Narrow', 'Arial Narrow', sans-serif" font-weight="700" font-size="18" letter-spacing="0.5">
        ЦЕНЫ И ОЧЕРЕДЬ
      </text>
      <text x="52" y="76" fill="#1f3a60" font-family="'Courier New', monospace" font-weight="700" font-size="11.5">
        МИНСК · ГАСТРОНОМ № 4
      </text>

      <!-- 3 Tabular Price Cells (Bread, Petrol, Queue) -->
      <!-- Cell 1: Bread -->
      <g transform="translate(216, 18)">
        <rect x="0" y="0" width="130" height="76" fill="#e6dac0" stroke="#3e3527" stroke-width="1.5"/>
        <text x="65" y="19" text-anchor="middle" fill="#1f3a60" font-family="'PT Sans Narrow', sans-serif" font-weight="700" font-size="12" letter-spacing="1">ХЛЕБ РЖАНОЙ</text>
        <line x1="8" y1="25" x2="122" y2="25" stroke="#3e3527" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="65" y="51" text-anchor="middle" fill="#251f17" font-family="'Courier New', monospace" font-weight="700" font-size="22">18 коп.</text>
        <text x="65" y="69" text-anchor="middle" fill="#98291e" font-family="'Courier New', monospace" font-weight="700" font-size="11.5">▲ +2 коп. за кв.</text>
      </g>

      <!-- Cell 2: Petrol AI-76 -->
      <g transform="translate(354, 18)">
        <rect x="0" y="0" width="130" height="76" fill="#e6dac0" stroke="#3e3527" stroke-width="1.5"/>
        <text x="65" y="19" text-anchor="middle" fill="#1f3a60" font-family="'PT Sans Narrow', sans-serif" font-weight="700" font-size="12" letter-spacing="1">БЕНЗИН АИ-76 (10 Л)</text>
        <line x1="8" y1="25" x2="122" y2="25" stroke="#3e3527" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="65" y="51" text-anchor="middle" fill="#251f17" font-family="'Courier New', monospace" font-weight="700" font-size="21">1 р. 60 к.</text>
        <text x="65" y="69" text-anchor="middle" fill="#98291e" font-family="'Courier New', monospace" font-weight="700" font-size="11.5">▲ +10 коп.</text>
      </g>

      <!-- Cell 3: Queue -->
      <g transform="translate(492, 18)">
        <rect x="0" y="0" width="126" height="76" fill="#e6dac0" stroke="#3e3527" stroke-width="1.5"/>
        <text x="63" y="19" text-anchor="middle" fill="#1f3a60" font-family="'PT Sans Narrow', sans-serif" font-weight="700" font-size="12" letter-spacing="1">ОЧЕРЕДЬ ЗА МЯСОМ</text>
        <line x1="8" y1="25" x2="118" y2="25" stroke="#3e3527" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="63" y="51" text-anchor="middle" fill="#251f17" font-family="'Courier New', monospace" font-weight="700" font-size="21">45 мин.</text>
        <text x="63" y="69" text-anchor="middle" fill="#1f3a60" font-family="'Courier New', monospace" font-weight="700" font-size="11.5">к открытию — 30 чел.</text>
      </g>
    </svg>