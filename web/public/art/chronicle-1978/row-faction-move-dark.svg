<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 116" width="100%" height="100%">
    <rect width="640" height="116" fill="#1c1915"/>
    <!-- Departmental bracketed strip -->
    <rect x="10" y="8" width="620" height="100" fill="#28201d" stroke="#e06c5a" stroke-width="1.8"/>
    <rect x="10" y="8" width="10" height="100" fill="#e06c5a"/>

    <!-- Left Faction Shield Seal (recognizable without reading) -->
    <g transform="translate(29, 18)">
      
    <polygon points="20,3 35,9 35,21 20,37 5,21 5,9" fill="#2c221e" stroke="#df6b5b" stroke-width="2.2"/>
    <polygon points="20,6.5 31.5,11 31.5,20 20,33 8.5,20 8.5,11" fill="none" stroke="#df6b5b" stroke-width="1"/>
    <path d="M 20,10 L 22.4,16.2 L 29,16.5 L 23.8,20.4 L 25.6,26.8 L 20,23 L 14.4,26.8 L 16.2,20.4 L 11,16.5 L 17.6,16.2 Z" fill="#df6b5b"/>
    </g>
    <text x="49" y="82" text-anchor="middle" fill="#e06c5a" font-family="'PT Sans Narrow', sans-serif" font-weight="700" font-size="11" letter-spacing="0.8">ЛАГЕРЬ</text>
    <text x="49" y="94" text-anchor="middle" fill="#b8a392" font-family="'Courier New', monospace" font-weight="700" font-size="10">САМ</text>

    <!-- Stamp pill: "ХОД ЛАГЕРЯ · БЕЗ ВАШЕЙ ПОДПИСИ" -->
    <rect x="82" y="16" width="248" height="20" fill="#e06c5a"/>
    <text x="206" y="30" text-anchor="middle" fill="#f8f0df" font-family="'PT Sans Narrow', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.5" letter-spacing="1.3">
      ХОД ЛАГЕРЯ · СЛУЖБА ПОРЯДКА
    </text>
    <text x="616" y="30" text-anchor="end" fill="#b8a392" font-family="'Courier New', monospace" font-weight="700" font-size="11.5">
      СВОЯ ПОВЕСТКА
    </text>

    <foreignObject x="82" y="42" width="536" height="62">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'PT Serif', Georgia, serif; font-size:15.8px; line-height:1.4; color:#eee3ce;">
        <strong>Без вашей визы</strong> ведомство передало в вечернюю сводку список «неблагонадёжных лекторов» университета — ректорат уже ждёт разъяснений от кабинета.
      </div>
    </foreignObject>
  </svg>