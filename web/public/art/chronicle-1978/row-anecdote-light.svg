<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 328 138" width="100%" height="100%">
      <rect width="328" height="138" fill="#dfd5b6"/>
      <!-- Second carbon-copy sheet peeking underneath -->
      <path d="M 6,6 L 320,5 L 323,42 L 320,86 L 322,130 L 6,132 L 4,90 L 7,44 Z" transform="translate(3, 2) rotate(0.4 164 69)" fill="#d7d0c3" stroke="#7a6e7d" stroke-width="1" stroke-dasharray="4 2"/>
      <!-- Main cigarette-paper samizdat slip -->
      <path d="M 6,6 L 320,5 L 323,42 L 320,86 L 322,130 L 6,132 L 4,90 L 7,44 Z" fill="#ebe7dc" stroke="#7a6e7d" stroke-width="1.4"/>
      <!-- Carbon-paper vertical fold line on left -->
      <line x1="56" y1="6" x2="56" y2="131" stroke="#7a6e7d" stroke-width="1.1" stroke-dasharray="5 3"/>

      <!-- Left visual identifier: Typewriter key ring + struck typo -->
      <g transform="translate(10, 16) scale(0.95)">
        
      <circle cx="20" cy="20" r="17" fill="#dfd8cb" stroke="#443654" stroke-width="2.2"/>
      <circle cx="20" cy="20" r="13.5" fill="none" stroke="#443654" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="20" y="22" text-anchor="middle" fill="#443654" font-family="'Courier New', monospace" font-weight="700" font-size="16">«»</text>
      <text x="20" y="31" text-anchor="middle" fill="#443654" font-family="'Courier New', monospace" font-weight="700" font-size="7.5" letter-spacing="0.8">САМ</text>
      </g>
      <text x="29" y="74" text-anchor="middle" fill="#6b5d75" font-family="'Courier New', monospace" font-weight="700" font-size="11">экз.4</text>
      <text x="29" y="92" text-anchor="middle" fill="#352947" font-family="'Courier New', monospace" font-weight="700" font-size="12" text-decoration="line-through">ххх</text>

      <!-- Rubric & Readable 14.5px Typewriter Body -->
      <text x="66" y="23" fill="#6b5d75" font-family="'Courier New', monospace" font-weight="700" font-size="11" letter-spacing="0.6">
        АНЕКДОТ КВАРТАЛА · САМИЗДАТ
      </text>
      <foreignObject x="66" y="29" width="248" height="100">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Courier New', 'PT Mono', monospace; font-size:14.2px; line-height:1.36; color:#352947;">
          — Почему в приёмной сняли часы с кукушкой?<br/>
          — Чтобы птица без визы не высказывалась о пятилетке.
        </div>
      </foreignObject>
    </svg>