<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" width="100%" height="100%">
  <defs>
    <mask id="perf-stamp-04-state-order">
      <rect x="6" y="6" width="348" height="428" fill="white"/>
      <path d="M20,6 H340 M20,434 H340 M6,20 V420 M354,20 V420" stroke="black" stroke-width="10.4" stroke-linecap="round" stroke-dasharray="0 20"/>
      <circle cx="6" cy="6" r="6.2" fill="black"/><circle cx="354" cy="6" r="6.2" fill="black"/>
      <circle cx="6" cy="434" r="6.2" fill="black"/><circle cx="354" cy="434" r="6.2" fill="black"/>
    </mask>
    <pattern id="hatch-stamp-04-state-order" width="16" height="5" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="16" y2="1" stroke="#6e1f1c" stroke-width="0.6" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Drop Shadow -->
  <rect x="12" y="14" width="336" height="414" fill="rgba(0,0,0,0.42)"/>

  <!-- Perforated Stamp Body -->
  <g mask="url(#perf-stamp-04-state-order)">
    <rect x="0" y="0" width="360" height="440" fill="#efe6d4"/>

    <!-- Outer Engraved Guilloche Border -->
    <rect x="22" y="22" width="316" height="396" fill="none" stroke="#6e1f1c" stroke-width="3.5"/>
    <rect x="28" y="28" width="304" height="384" fill="none" stroke="#6e1f1c" stroke-width="1.2" stroke-dasharray="4 2"/>

    <!-- Top Country Header Bar -->
    <rect x="34" y="34" width="292" height="26" fill="#6e1f1c"/>
    <text x="180" y="51" text-anchor="middle" fill="#efe6d4" font-family="'PT Sans Narrow', 'Arial Narrow', sans-serif" font-weight="700" font-size="13.2" letter-spacing="1.0" textLength="256" lengthAdjust="spacingAndGlyphs">ПОЧТА НЕМАНСКОЙ РЕСПУБЛИКИ</text>

    <!-- Center Engraved Vignette Window -->
    <rect x="42" y="66" width="276" height="202" fill="#d8d4cf" stroke="#6e1f1c" stroke-width="2"/>
    <rect x="44" y="66" width="272" height="202" fill="url(#hatch-stamp-04-state-order)"/>
    <g>
      <polygon points="56,264 148,74 196,74 92,264" fill="#f7efe0" opacity="0.5"/>
      <polygon points="304,264 212,74 164,74 268,264" fill="#f7efe0" opacity="0.5"/>
      <rect x="74" y="140" width="26" height="122" fill="#2f3842"/>
      <polygon points="74,140 87,124 100,140" fill="#6e1f1c"/>
      <polygon points="74,158 100,146 100,164 74,176" fill="#f7efe0"/>
      <polygon points="74,194 100,182 100,200 74,212" fill="#f7efe0"/>
      <polygon points="74,230 100,218 100,236 74,248" fill="#f7efe0"/>
      <line x1="196" y1="84" x2="196" y2="266" stroke="#2f3842" stroke-width="6"/>
      <rect x="168" y="102" width="56" height="8" fill="#2f3842"/>
      <polygon points="196,114 262,136 250,216 196,256 142,216 130,136" fill="#6e1f1c" stroke="#f5ecd8" stroke-width="3"/>
      <polygon points="196,126 248,144 238,208 196,242 154,208 144,144" fill="none" stroke="#f5ecd8" stroke-width="1.5"/>
      <polygon points="196,148 204,172 228,172 208,186 216,210 196,196 176,210 184,186 164,172 188,172" fill="#f5ecd8"/>
    </g>

    <!-- Series & Issue Year Bar -->
    <text x="44" y="285" fill="#2f3842" font-family="'Courier New', monospace" font-weight="700" font-size="9.8" letter-spacing="0.2">ГОСУДАРСТВЕННЫЙ ПОРЯДОК</text>
    <text x="316" y="285" text-anchor="end" fill="#6e1f1c" font-family="'Courier New', monospace" font-weight="700" font-size="11" letter-spacing="0.4">1979 г.</text>
    <line x1="42" y1="292" x2="318" y2="292" stroke="#6e1f1c" stroke-width="1.5"/>

    <!-- Bottom Denomination Cartouche -->
    <rect x="42" y="302" width="82" height="86" fill="#6e1f1c"/>
    <rect x="47" y="307" width="72" height="76" fill="none" stroke="#efe6d4" stroke-width="1.2"/>
    <text x="83" y="352" text-anchor="middle" fill="#efe6d4" font-family="'PT Serif', Georgia, serif" font-weight="700" font-size="39">6</text>
    <text x="83" y="374" text-anchor="middle" fill="#efe6d4" font-family="'PT Sans Narrow', sans-serif" font-weight="700" font-size="13.5" letter-spacing="1.8">КОП.</text>

    <!-- Pure SVG Event Title, Subtitle & Catalog Number strictly inside [x=134 .. x=314] -->
    <text x="134" y="315" fill="#6e1f1c" font-family="'PT Sans Narrow', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.2" letter-spacing="0.1">НА СТРАЖЕ ЗАКОНА</text>
    <text x="134" y="331" fill="#2f3842" font-family="'PT Serif', Georgia, serif" font-style="italic" font-size="10.2">ДИСЦИПЛИНА И</text>
    <text x="134" y="343.2" fill="#2f3842" font-family="'PT Serif', Georgia, serif" font-style="italic" font-size="10.2">РУБЕЖ НР</text>
    <line x1="134" y1="369" x2="310" y2="369" stroke="#6e1f1c" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="134" y="382" fill="#6e1f1c" font-family="'Courier New', monospace" font-weight="700" font-size="8.6">КАТАЛОГ ЦФА/НР № НР-1979-11</text>

    <!-- Bottom Miniature Footnote -->
    <text x="180" y="405" text-anchor="middle" fill="#2f3842" font-family="'Courier New', monospace" font-size="9.2" letter-spacing="0.9">ГОЗНАК МИНСК · МЕТАЛЛОГРАФИЯ · 1979</text>

    <!-- Postmark Cancellation -->
    <g transform="translate(282, 362) rotate(-14)" opacity="0.46">
        <circle cx="0" cy="0" r="40" fill="none" stroke="#1e1b18" stroke-width="2"/>
        <circle cx="0" cy="0" r="31" fill="none" stroke="#1e1b18" stroke-width="1" stroke-dasharray="6 3"/>
        <text x="0" y="-10" text-anchor="middle" fill="#1e1b18" font-family="'Courier New', monospace" font-weight="700" font-size="8.4" letter-spacing="0.8">ПОЧТА НР</text>
        <line x1="-27" y1="-4" x2="27" y2="-4" stroke="#1e1b18" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" fill="#1e1b18" font-family="'Courier New', monospace" font-weight="700" font-size="7.4">МИНСК · ОСОБЫЙ</text>
        <line x1="-27" y1="10" x2="27" y2="10" stroke="#1e1b18" stroke-width="1"/>
        <path d="M -70,-8 Q -54,-14 -40,-8 M -70,4 Q -54,-2 -40,4 M -70,16 Q -54,10 -40,16" fill="none" stroke="#1e1b18" stroke-width="1.5"/>
      </g>
  </g>
</svg>