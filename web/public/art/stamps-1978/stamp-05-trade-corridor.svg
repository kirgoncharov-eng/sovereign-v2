<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" width="100%" height="100%">
  <defs>
    <mask id="perf-stamp-05-trade-corridor">
      <rect x="6" y="6" width="348" height="428" fill="white"/>
      <path d="M20,6 H340 M20,434 H340 M6,20 V420 M354,20 V420" stroke="black" stroke-width="10.4" stroke-linecap="round" stroke-dasharray="0 20"/>
      <circle cx="6" cy="6" r="6.2" fill="black"/><circle cx="354" cy="6" r="6.2" fill="black"/>
      <circle cx="6" cy="434" r="6.2" fill="black"/><circle cx="354" cy="434" r="6.2" fill="black"/>
    </mask>
    <pattern id="hatch-stamp-05-trade-corridor" width="16" height="5" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="16" y2="1" stroke="#194b59" stroke-width="0.6" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Drop Shadow -->
  <rect x="12" y="14" width="336" height="414" fill="rgba(0,0,0,0.42)"/>

  <!-- Perforated Stamp Body -->
  <g mask="url(#perf-stamp-05-trade-corridor)">
    <rect x="0" y="0" width="360" height="440" fill="#f2ebd9"/>

    <!-- Outer Engraved Guilloche Border -->
    <rect x="22" y="22" width="316" height="396" fill="none" stroke="#194b59" stroke-width="3.5"/>
    <rect x="28" y="28" width="304" height="384" fill="none" stroke="#194b59" stroke-width="1.2" stroke-dasharray="4 2"/>

    <!-- Top Country Header Bar -->
    <rect x="34" y="34" width="292" height="26" fill="#194b59"/>
    <text x="180" y="52" text-anchor="middle" fill="#f2ebd9" font-family="'PT Sans Narrow', 'Arial Narrow', sans-serif" font-weight="700" font-size="16" letter-spacing="2.2">
      ПОЧТА НЕМАНСКОЙ РЕСПУБЛИКИ
    </text>

    <!-- Center Engraved Vignette Window -->
    <rect x="42" y="66" width="276" height="202" fill="#d4e6ea" stroke="#194b59" stroke-width="2"/>
    <rect x="44" y="66" width="272" height="202" fill="url(#hatch-stamp-05-trade-corridor)"/>
    <g>
      <circle cx="180" cy="154" r="68" fill="none" stroke="#9c6221" stroke-width="1.6"/>
      <ellipse cx="180" cy="154" rx="34" ry="68" fill="none" stroke="#9c6221" stroke-width="1.2"/>
      <line x1="112" y1="154" x2="248" y2="154" stroke="#9c6221" stroke-width="1.2"/>
      <path d="M 48,232 L 312,232 L 312,262 L 276,262 A 22,22 0 0,0 232,262 L 202,262 A 22,22 0 0,0 158,262 L 128,262 A 22,22 0 0,0 84,262 L 48,262 Z" fill="#194b59"/>
      <polygon points="82,188 236,188 254,228 82,228" fill="#9c6221" stroke="#f2ebd9" stroke-width="2"/>
      <polygon points="214,194 242,194 248,210 214,210" fill="#f2ebd9"/>
      <line x1="92" y1="216" x2="236" y2="216" stroke="#f2ebd9" stroke-width="3"/>
      <text x="180" y="102" text-anchor="middle" fill="#194b59" font-family="'Courier New', monospace" font-weight="700" font-size="13" letter-spacing="2">ЗАПАДНЫЙ ТРАНЗИТ</text>
    </g>

    <!-- Series & Issue Year Bar -->
    <text x="44" y="285" fill="#9c6221" font-family="'Courier New', monospace" font-weight="700" font-size="10.4" letter-spacing="0.4">
      МЕЖДУНАРОДНАЯ ТОРГОВЛЯ
    </text>
    <text x="316" y="285" text-anchor="end" fill="#194b59" font-family="'Courier New', monospace" font-weight="700" font-size="11.5" letter-spacing="0.6">
      1980 г.
    </text>
    <line x1="42" y1="292" x2="318" y2="292" stroke="#194b59" stroke-width="1.5"/>

    <!-- Bottom Denomination Cartouche -->
    <rect x="42" y="302" width="82" height="86" fill="#194b59"/>
    <rect x="47" y="307" width="72" height="76" fill="none" stroke="#f2ebd9" stroke-width="1.2"/>
    <text x="83" y="352" text-anchor="middle" fill="#f2ebd9" font-family="'PT Serif', Georgia, serif" font-weight="700" font-size="39">
      15
    </text>
    <text x="83" y="374" text-anchor="middle" fill="#f2ebd9" font-family="'PT Sans Narrow', sans-serif" font-weight="700" font-size="13.5" letter-spacing="1.8">
      КОП.
    </text>

    <!-- Event Title & Subtitle strictly bounded inside [x=134 .. x=314] (180px width) -->
    <foreignObject x="134" y="302" width="180" height="86">
      <div xmlns="http://www.w3.org/1999/xhtml" style="width:180px;height:86px;display:flex;flex-direction:column;justify-content:space-between;">
        <div>
          <div style="font-family:'PT Sans Narrow', 'Arial Narrow', sans-serif;font-weight:700;font-size:14.2px;line-height:1.15;color:#194b59;letter-spacing:0.2px;">
            ТОРГОВЫЙ МОСТ ЕВРОПЫ
          </div>
          <div style="font-family:'PT Serif', Georgia, serif;font-style:italic;font-size:11px;line-height:1.22;color:#9c6221;margin-top:4px;">
            МИНСК — ГДАНЬСК — ВЕНА
          </div>
        </div>
        <div style="border-top:1px dashed #194b59;padding-top:4px;font-family:'Courier New', monospace;font-weight:700;font-size:10px;color:#194b59;">
          КАТАЛОГ ЦФА/НР № НР-1980-03
        </div>
      </div>
    </foreignObject>

    <!-- Bottom Miniature Footnote -->
    <text x="180" y="405" text-anchor="middle" fill="#9c6221" font-family="'Courier New', monospace" font-size="9.5" letter-spacing="1.2">
      ГОЗНАК МИНСК · МЕТАЛЛОГРАФИЯ · 1980
    </text>

    <!-- Postmark Cancellation -->
    <g transform="translate(282, 362) rotate(-14)" opacity="0.46">
        <circle cx="0" cy="0" r="40" fill="none" stroke="#1e1b18" stroke-width="2"/>
        <circle cx="0" cy="0" r="31" fill="none" stroke="#1e1b18" stroke-width="1" stroke-dasharray="6 3"/>
        <text x="0" y="-10" text-anchor="middle" fill="#1e1b18" font-family="'Courier New', monospace" font-weight="700" font-size="8.4" letter-spacing="0.8">ПОЧТА НР</text>
        <line x1="-27" y1="-4" x2="27" y2="-4" stroke="#1e1b18" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" fill="#1e1b18" font-family="'Courier New', monospace" font-weight="700" font-size="7.4">БРЕСТ · ТАМОЖНЯ</text>
        <line x1="-27" y1="10" x2="27" y2="10" stroke="#1e1b18" stroke-width="1"/>
        <path d="M -70,-8 Q -54,-14 -40,-8 M -70,4 Q -54,-2 -40,4 M -70,16 Q -54,10 -40,16" fill="none" stroke="#1e1b18" stroke-width="1.5"/>
      </g>
  </g>
</svg>