<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" width="100%" height="100%">
  <defs>
    <mask id="perf-stamp-07-soligorsk-potash">
      <rect x="6" y="6" width="348" height="428" fill="white"/>
      <path d="M20,6 H340 M20,434 H340 M6,20 V420 M354,20 V420" stroke="black" stroke-width="10.4" stroke-linecap="round" stroke-dasharray="0 20"/>
      <circle cx="6" cy="6" r="6.2" fill="black"/><circle cx="354" cy="6" r="6.2" fill="black"/>
      <circle cx="6" cy="434" r="6.2" fill="black"/><circle cx="354" cy="434" r="6.2" fill="black"/>
    </mask>
    <pattern id="hatch-stamp-07-soligorsk-potash" width="16" height="5" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="16" y2="1" stroke="#7c321d" stroke-width="0.6" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Drop Shadow -->
  <rect x="12" y="14" width="336" height="414" fill="rgba(0,0,0,0.42)"/>

  <!-- Perforated Stamp Body -->
  <g mask="url(#perf-stamp-07-soligorsk-potash)">
    <rect x="0" y="0" width="360" height="440" fill="#f2e8d3"/>

    <!-- Outer Engraved Guilloche Border -->
    <rect x="22" y="22" width="316" height="396" fill="none" stroke="#7c321d" stroke-width="3.5"/>
    <rect x="28" y="28" width="304" height="384" fill="none" stroke="#7c321d" stroke-width="1.2" stroke-dasharray="4 2"/>

    <!-- Top Country Header Bar -->
    <rect x="34" y="34" width="292" height="26" fill="#7c321d"/>
    <text x="180" y="51" text-anchor="middle" fill="#f2e8d3" font-family="'PT Sans Narrow', 'Arial Narrow', sans-serif" font-weight="700" font-size="13.2" letter-spacing="1.0" textLength="256" lengthAdjust="spacingAndGlyphs">ПОЧТА НЕМАНСКОЙ РЕСПУБЛИКИ</text>

    <!-- Center Engraved Vignette Window -->
    <rect x="42" y="66" width="276" height="202" fill="#e6d2b8" stroke="#7c321d" stroke-width="2"/>
    <rect x="44" y="66" width="272" height="202" fill="url(#hatch-stamp-07-soligorsk-potash)"/>
    <g>
      <polygon points="104,92 138,92 148,204 94,204" fill="#7c321d"/>
      <circle cx="121" cy="116" r="14" fill="#f2e8d3" stroke="#3b352e" stroke-width="3"/>
      <line x1="121" y1="116" x2="176" y2="188" stroke="#3b352e" stroke-width="2.5"/>
      <polygon points="204,108 234,108 242,204 196,204" fill="#3b352e"/>
      <circle cx="219" cy="128" r="11" fill="#f2e8d3" stroke="#7c321d" stroke-width="2.5"/>
      <rect x="48" y="204" width="264" height="58" fill="#3b352e"/>
      <path d="M 48,220 Q 110,210 180,222 T 312,216" fill="none" stroke="#7c321d" stroke-width="5"/>
      <path d="M 48,238 Q 120,228 180,240 T 312,234" fill="none" stroke="#f2e8d3" stroke-width="2.5" stroke-dasharray="8 4"/>
      <g transform="translate(174, 152)" stroke="#3b352e" stroke-width="3.5">
        <line x1="-18" y1="18" x2="18" y2="-18"/>
        <line x1="18" y1="18" x2="-18" y2="-18"/>
      </g>
    </g>

    <!-- Series & Issue Year Bar -->
    <text x="44" y="285" fill="#3b352e" font-family="'Courier New', monospace" font-weight="700" font-size="9.8" letter-spacing="0.2">НЕДРА · СОЛИГОРСК</text>
    <text x="316" y="285" text-anchor="end" fill="#7c321d" font-family="'Courier New', monospace" font-weight="700" font-size="11" letter-spacing="0.4">1980 г.</text>
    <line x1="42" y1="292" x2="318" y2="292" stroke="#7c321d" stroke-width="1.5"/>

    <!-- Bottom Denomination Cartouche -->
    <rect x="42" y="302" width="82" height="86" fill="#7c321d"/>
    <rect x="47" y="307" width="72" height="76" fill="none" stroke="#f2e8d3" stroke-width="1.2"/>
    <text x="83" y="352" text-anchor="middle" fill="#f2e8d3" font-family="'PT Serif', Georgia, serif" font-weight="700" font-size="39">10</text>
    <text x="83" y="374" text-anchor="middle" fill="#f2e8d3" font-family="'PT Sans Narrow', sans-serif" font-weight="700" font-size="13.5" letter-spacing="1.8">КОП.</text>

    <!-- Pure SVG Event Title, Subtitle & Catalog Number strictly inside [x=134 .. x=314] -->
    <text x="134" y="315" fill="#7c321d" font-family="'PT Sans Narrow', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.2" letter-spacing="0.1">КАЛИЙНЫЙ БАССЕЙН</text>
    <text x="134" y="331" fill="#3b352e" font-family="'PT Serif', Georgia, serif" font-style="italic" font-size="10.2">ЗАЩИТА СТВОЛА № 2</text>
    <line x1="134" y1="369" x2="310" y2="369" stroke="#7c321d" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="134" y="382" fill="#7c321d" font-family="'Courier New', monospace" font-weight="700" font-size="8.6">КАТАЛОГ ЦФА/НР № НР-1980-12</text>

    <!-- Bottom Miniature Footnote -->
    <text x="180" y="405" text-anchor="middle" fill="#3b352e" font-family="'Courier New', monospace" font-size="9.2" letter-spacing="0.9">ГОЗНАК МИНСК · МЕТАЛЛОГРАФИЯ · 1980</text>

    <!-- Postmark Cancellation -->
    <g transform="translate(282, 362) rotate(-14)" opacity="0.46">
        <circle cx="0" cy="0" r="40" fill="none" stroke="#1e1b18" stroke-width="2"/>
        <circle cx="0" cy="0" r="31" fill="none" stroke="#1e1b18" stroke-width="1" stroke-dasharray="6 3"/>
        <text x="0" y="-10" text-anchor="middle" fill="#1e1b18" font-family="'Courier New', monospace" font-weight="700" font-size="8.4" letter-spacing="0.8">ПОЧТА НР</text>
        <line x1="-27" y1="-4" x2="27" y2="-4" stroke="#1e1b18" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" fill="#1e1b18" font-family="'Courier New', monospace" font-weight="700" font-size="7.4">СОЛИГОРСК · 80</text>
        <line x1="-27" y1="10" x2="27" y2="10" stroke="#1e1b18" stroke-width="1"/>
        <path d="M -70,-8 Q -54,-14 -40,-8 M -70,4 Q -54,-2 -40,4 M -70,16 Q -54,10 -40,16" fill="none" stroke="#1e1b18" stroke-width="1.5"/>
      </g>
  </g>
</svg>