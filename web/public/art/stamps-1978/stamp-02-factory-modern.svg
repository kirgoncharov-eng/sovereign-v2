<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" width="100%" height="100%">
  <defs>
    <mask id="perf-stamp-02-factory-modern">
      <rect x="6" y="6" width="348" height="428" fill="white"/>
      <path d="M20,6 H340 M20,434 H340 M6,20 V420 M354,20 V420" stroke="black" stroke-width="10.4" stroke-linecap="round" stroke-dasharray="0 20"/>
      <circle cx="6" cy="6" r="6.2" fill="black"/><circle cx="354" cy="6" r="6.2" fill="black"/>
      <circle cx="6" cy="434" r="6.2" fill="black"/><circle cx="354" cy="434" r="6.2" fill="black"/>
    </mask>
    <pattern id="hatch-stamp-02-factory-modern" width="16" height="5" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="16" y2="1" stroke="#1d3d63" stroke-width="0.6" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Drop Shadow -->
  <rect x="12" y="14" width="336" height="414" fill="rgba(0,0,0,0.42)"/>

  <!-- Perforated Stamp Body -->
  <g mask="url(#perf-stamp-02-factory-modern)">
    <rect x="0" y="0" width="360" height="440" fill="#f1ebd8"/>

    <!-- Outer Engraved Guilloche Border -->
    <rect x="22" y="22" width="316" height="396" fill="none" stroke="#1d3d63" stroke-width="3.5"/>
    <rect x="28" y="28" width="304" height="384" fill="none" stroke="#1d3d63" stroke-width="1.2" stroke-dasharray="4 2"/>

    <!-- Top Country Header Bar -->
    <rect x="34" y="34" width="292" height="26" fill="#1d3d63"/>
    <text x="180" y="51" text-anchor="middle" fill="#f1ebd8" font-family="'PT Sans Narrow', 'Arial Narrow', sans-serif" font-weight="700" font-size="13.2" letter-spacing="1.0" textLength="256" lengthAdjust="spacingAndGlyphs">ПОЧТА НЕМАНСКОЙ РЕСПУБЛИКИ</text>

    <!-- Center Engraved Vignette Window -->
    <rect x="42" y="66" width="276" height="202" fill="#d7e2ec" stroke="#1d3d63" stroke-width="2"/>
    <rect x="44" y="66" width="272" height="202" fill="url(#hatch-stamp-02-factory-modern)"/>
    <g>
      <circle cx="222" cy="144" r="52" fill="none" stroke="#a34824" stroke-width="9" stroke-dasharray="14 8" opacity="0.85"/>
      <circle cx="222" cy="144" r="38" fill="none" stroke="#a34824" stroke-width="2.5"/>
      <polygon points="48,256 48,186 88,208 88,186 128,208 128,186 168,208 168,256" fill="#1d3d63" opacity="0.22"/>
      <rect x="62" y="114" width="16" height="76" fill="#1d3d63"/>
      <rect x="92" y="128" width="14" height="64" fill="#1d3d63"/>
      <path d="M 70,110 Q 95,94 135,98 M 99,122 Q 124,108 158,112" fill="none" stroke="#1d3d63" stroke-width="3" stroke-linecap="round"/>
      <rect x="116" y="176" width="92" height="44" fill="#1d3d63" stroke="#f1ebd8" stroke-width="2"/>
      <polygon points="184,132 238,132 246,182 184,182" fill="#1d3d63" stroke="#f1ebd8" stroke-width="2"/>
      <polygon points="192,140 230,140 236,172 192,172" fill="#d7e2ec"/>
      <rect x="134" y="140" width="8" height="38" fill="#1d3d63"/>
      <circle cx="216" cy="222" r="36" fill="#1d3d63" stroke="#f1ebd8" stroke-width="3"/>
      <circle cx="216" cy="222" r="16" fill="#a34824" stroke="#f1ebd8" stroke-width="2"/>
      <circle cx="126" cy="234" r="24" fill="#1d3d63" stroke="#f1ebd8" stroke-width="3"/>
      <circle cx="126" cy="234" r="10" fill="#a34824"/>
      <line x1="48" y1="260" x2="312" y2="260" stroke="#1d3d63" stroke-width="4"/>
    </g>

    <!-- Series & Issue Year Bar -->
    <text x="44" y="285" fill="#a34824" font-family="'Courier New', monospace" font-weight="700" font-size="9.8" letter-spacing="0.2">ИНДУСТРИЯ ПЯТИЛЕТКИ</text>
    <text x="316" y="285" text-anchor="end" fill="#1d3d63" font-family="'Courier New', monospace" font-weight="700" font-size="11" letter-spacing="0.4">1979 г.</text>
    <line x1="42" y1="292" x2="318" y2="292" stroke="#1d3d63" stroke-width="1.5"/>

    <!-- Bottom Denomination Cartouche -->
    <rect x="42" y="302" width="82" height="86" fill="#1d3d63"/>
    <rect x="47" y="307" width="72" height="76" fill="none" stroke="#f1ebd8" stroke-width="1.2"/>
    <text x="83" y="352" text-anchor="middle" fill="#f1ebd8" font-family="'PT Serif', Georgia, serif" font-weight="700" font-size="39">6</text>
    <text x="83" y="374" text-anchor="middle" fill="#f1ebd8" font-family="'PT Sans Narrow', sans-serif" font-weight="700" font-size="13.5" letter-spacing="1.8">КОП.</text>

    <!-- Pure SVG Event Title, Subtitle & Catalog Number strictly inside [x=134 .. x=314] -->
    <text x="134" y="315" fill="#1d3d63" font-family="'PT Sans Narrow', 'Arial Narrow', sans-serif" font-weight="700" font-size="12.2" letter-spacing="0.1">СТАНКИ И ТРАКТОРЫ</text>
    <text x="134" y="331" fill="#a34824" font-family="'PT Serif', Georgia, serif" font-style="italic" font-size="10.2">ОБНОВЛЕНИЕ</text>
    <text x="134" y="343.2" fill="#a34824" font-family="'PT Serif', Georgia, serif" font-style="italic" font-size="10.2">ЗАВОДОВ НР</text>
    <line x1="134" y1="369" x2="310" y2="369" stroke="#1d3d63" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="134" y="382" fill="#1d3d63" font-family="'Courier New', monospace" font-weight="700" font-size="8.6">КАТАЛОГ ЦФА/НР № НР-1979-04</text>

    <!-- Bottom Miniature Footnote -->
    <text x="180" y="405" text-anchor="middle" fill="#a34824" font-family="'Courier New', monospace" font-size="9.2" letter-spacing="0.9">ГОЗНАК МИНСК · МЕТАЛЛОГРАФИЯ · 1979</text>

    <!-- Postmark Cancellation -->
    <g transform="translate(282, 362) rotate(-14)" opacity="0.46">
        <circle cx="0" cy="0" r="40" fill="none" stroke="#1e1b18" stroke-width="2"/>
        <circle cx="0" cy="0" r="31" fill="none" stroke="#1e1b18" stroke-width="1" stroke-dasharray="6 3"/>
        <text x="0" y="-10" text-anchor="middle" fill="#1e1b18" font-family="'Courier New', monospace" font-weight="700" font-size="8.4" letter-spacing="0.8">ПОЧТА НР</text>
        <line x1="-27" y1="-4" x2="27" y2="-4" stroke="#1e1b18" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" fill="#1e1b18" font-family="'Courier New', monospace" font-weight="700" font-size="7.4">МИНСК · ЗАВОД</text>
        <line x1="-27" y1="10" x2="27" y2="10" stroke="#1e1b18" stroke-width="1"/>
        <path d="M -70,-8 Q -54,-14 -40,-8 M -70,4 Q -54,-2 -40,4 M -70,16 Q -54,10 -40,16" fill="none" stroke="#1e1b18" stroke-width="1.5"/>
      </g>
  </g>
</svg>