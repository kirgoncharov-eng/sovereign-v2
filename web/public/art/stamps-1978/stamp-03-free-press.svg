<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" width="100%" height="100%">
  <defs>
    <mask id="perf-stamp-03-free-press">
      <rect x="6" y="6" width="348" height="428" fill="white"/>
      <path d="M20,6 H340 M20,434 H340 M6,20 V420 M354,20 V420" stroke="black" stroke-width="10.4" stroke-linecap="round" stroke-dasharray="0 20"/>
      <circle cx="6" cy="6" r="6.2" fill="black"/><circle cx="354" cy="6" r="6.2" fill="black"/>
      <circle cx="6" cy="434" r="6.2" fill="black"/><circle cx="354" cy="434" r="6.2" fill="black"/>
    </mask>
    <pattern id="hatch-stamp-03-free-press" width="16" height="5" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="16" y2="1" stroke="#1f543d" stroke-width="0.6" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Drop Shadow -->
  <rect x="12" y="14" width="336" height="414" fill="rgba(0,0,0,0.42)"/>

  <!-- Perforated Stamp Body -->
  <g mask="url(#perf-stamp-03-free-press)">
    <rect x="0" y="0" width="360" height="440" fill="#f0ecda"/>

    <!-- Outer Engraved Guilloche Border -->
    <rect x="22" y="22" width="316" height="396" fill="none" stroke="#1f543d" stroke-width="3.5"/>
    <rect x="28" y="28" width="304" height="384" fill="none" stroke="#1f543d" stroke-width="1.2" stroke-dasharray="4 2"/>

    <!-- Top Country Header Bar -->
    <rect x="34" y="34" width="292" height="26" fill="#1f543d"/>
    <text x="180" y="52" text-anchor="middle" fill="#f0ecda" font-family="'PT Sans Narrow', 'Arial Narrow', sans-serif" font-weight="700" font-size="16" letter-spacing="2.2">
      ПОЧТА НЕМАНСКОЙ РЕСПУБЛИКИ
    </text>

    <!-- Center Engraved Vignette Window -->
    <rect x="42" y="66" width="276" height="202" fill="#d7e8de" stroke="#1f543d" stroke-width="2"/>
    <rect x="44" y="66" width="272" height="202" fill="url(#hatch-stamp-03-free-press)"/>
    <g>
      <circle cx="180" cy="128" r="24" fill="none" stroke="#243b5e" stroke-width="2" stroke-dasharray="6 4"/>
      <circle cx="180" cy="128" r="48" fill="none" stroke="#243b5e" stroke-width="2" stroke-dasharray="8 4"/>
      <circle cx="180" cy="128" r="74" fill="none" stroke="#243b5e" stroke-width="1.8" stroke-dasharray="10 5"/>
      <polygon points="180,88 156,248 166,248 180,118 194,248 204,248" fill="#1f543d"/>
      <line x1="168" y1="154" x2="192" y2="154" stroke="#1f543d" stroke-width="3"/>
      <line x1="162" y1="188" x2="198" y2="188" stroke="#1f543d" stroke-width="3"/>
      <circle cx="180" cy="88" r="6" fill="#243b5e"/>
      <path d="M 68,214 L 176,228 L 176,268 L 68,254 Z" fill="#f5f0e1" stroke="#1f543d" stroke-width="2.8"/>
      <path d="M 292,214 L 184,228 L 184,268 L 292,254 Z" fill="#f5f0e1" stroke="#1f543d" stroke-width="2.8"/>
      <line x1="82" y1="228" x2="162" y2="238" stroke="#1f543d" stroke-width="3"/>
      <line x1="82" y1="239" x2="154" y2="248" stroke="#243b5e" stroke-width="2"/>
      <line x1="278" y1="228" x2="198" y2="238" stroke="#1f543d" stroke-width="3"/>
      <line x1="278" y1="239" x2="206" y2="248" stroke="#243b5e" stroke-width="2"/>
    </g>

    <!-- Series & Issue Year Bar -->
    <text x="44" y="285" fill="#243b5e" font-family="'Courier New', monospace" font-weight="700" font-size="10.4" letter-spacing="0.4">
      ЗАКОН О ПЕЧАТИ И ЭФИРЕ
    </text>
    <text x="316" y="285" text-anchor="end" fill="#1f543d" font-family="'Courier New', monospace" font-weight="700" font-size="11.5" letter-spacing="0.6">
      1979 г.
    </text>
    <line x1="42" y1="292" x2="318" y2="292" stroke="#1f543d" stroke-width="1.5"/>

    <!-- Bottom Denomination Cartouche -->
    <rect x="42" y="302" width="82" height="86" fill="#1f543d"/>
    <rect x="47" y="307" width="72" height="76" fill="none" stroke="#f0ecda" stroke-width="1.2"/>
    <text x="83" y="352" text-anchor="middle" fill="#f0ecda" font-family="'PT Serif', Georgia, serif" font-weight="700" font-size="39">
      4
    </text>
    <text x="83" y="374" text-anchor="middle" fill="#f0ecda" font-family="'PT Sans Narrow', sans-serif" font-weight="700" font-size="13.5" letter-spacing="1.8">
      КОП.
    </text>

    <!-- Event Title & Subtitle strictly bounded inside [x=134 .. x=314] (180px width) -->
    <foreignObject x="134" y="302" width="180" height="86">
      <div xmlns="http://www.w3.org/1999/xhtml" style="width:180px;height:86px;display:flex;flex-direction:column;justify-content:space-between;">
        <div>
          <div style="font-family:'PT Sans Narrow', 'Arial Narrow', sans-serif;font-weight:700;font-size:14.2px;line-height:1.15;color:#1f543d;letter-spacing:0.2px;">
            ОТКРЫТАЯ ТРИБУНА
          </div>
          <div style="font-family:'PT Serif', Georgia, serif;font-style:italic;font-size:11px;line-height:1.22;color:#243b5e;margin-top:4px;">
            РАДИО И СВОБОДНАЯ ПЕЧАТЬ
          </div>
        </div>
        <div style="border-top:1px dashed #1f543d;padding-top:4px;font-family:'Courier New', monospace;font-weight:700;font-size:10px;color:#1f543d;">
          КАТАЛОГ ЦФА/НР № НР-1979-09
        </div>
      </div>
    </foreignObject>

    <!-- Bottom Miniature Footnote -->
    <text x="180" y="405" text-anchor="middle" fill="#243b5e" font-family="'Courier New', monospace" font-size="9.5" letter-spacing="1.2">
      ГОЗНАК МИНСК · МЕТАЛЛОГРАФИЯ · 1979
    </text>

    <!-- Postmark Cancellation -->
    <g transform="translate(282, 362) rotate(-14)" opacity="0.46">
        <circle cx="0" cy="0" r="40" fill="none" stroke="#1e1b18" stroke-width="2"/>
        <circle cx="0" cy="0" r="31" fill="none" stroke="#1e1b18" stroke-width="1" stroke-dasharray="6 3"/>
        <text x="0" y="-10" text-anchor="middle" fill="#1e1b18" font-family="'Courier New', monospace" font-weight="700" font-size="8.4" letter-spacing="0.8">ПОЧТА НР</text>
        <line x1="-27" y1="-4" x2="27" y2="-4" stroke="#1e1b18" stroke-width="1"/>
        <text x="0" y="5" text-anchor="middle" fill="#1e1b18" font-family="'Courier New', monospace" font-weight="700" font-size="7.4">ДОМ РАДИО · 1979</text>
        <line x1="-27" y1="10" x2="27" y2="10" stroke="#1e1b18" stroke-width="1"/>
        <path d="M -70,-8 Q -54,-14 -40,-8 M -70,4 Q -54,-2 -40,4 M -70,16 Q -54,10 -40,16" fill="none" stroke="#1e1b18" stroke-width="1.5"/>
      </g>
  </g>
</svg>